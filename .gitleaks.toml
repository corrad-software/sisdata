# Gitleaks configuration (SRS-ADM-24: secret scanning).
# Extends the built-in ruleset; only known-safe placeholder/fixture files are allowlisted.
# Do NOT add real source paths here to silence a finding — rotate the secret instead.

title = "SISDATA gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholder env templates and non-production test fixtures"
paths = [
    '''(^|/)\.env\.example$''',
    '''(^|/)frontend/\.env\.example$''',
    '''^tests/fixtures/''',
    '''^frontend/e2e/fixtures/''',
    '''^composer\.lock$''',
    '''^frontend/package-lock\.json$''',
]
# Exact, anchored matches of the *secret value* for three known non-secrets in commit b3d6953.
# Anchored so a real key/token can never match them (do not loosen these into prefixes):
#  - AKIA…NOP (20 chars)      fake AWS key used as test input (tests/Modules/Adm/LogTest.php); see the regex below
#  - eyJhbGciOiJSUzI1NiJ9.    truncated JWT header stub, no payload/signature (tests/Modules/Wfe/MfaStepUpTest.php)
#  - API/encryption           two words of prose in a docblock (app/Modules/Aud/Services/SensitiveFieldMasker.php)
regexes = [
    # One character is in a [class] so this file does not itself contain a literal AWS key id
    # (Semgrep's secrets rules scan this file too). It still matches exactly that 20-char value.
    '''^AKIAABCDEFGHIJKLMNO[P]$''',
    '''^eyJhbGciOiJSUzI1NiJ9\.$''',
    '''^API/encryption$''',
]
